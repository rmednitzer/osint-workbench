name: Audit locked dependencies
on:
  workflow_call:
  schedule:
    # GitHub cron is UTC; Renovate's Europe/Vienna schedule is a separate policy.
    - cron: "23 5 * * 2"
  workflow_dispatch:
permissions:
  contents: read
# Superseded PR work may stop; every non-PR run keeps its own evidence.
concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            ubuntu: "24.04"
            python: "3.12"
          - runner: ubuntu-24.04
            ubuntu: "24.04"
            python: "3.13"
          - runner: ubuntu-26.04
            ubuntu: "26.04"
            python: "3.14"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          prune-cache: true
      - name: Install the locked audit tool and export runtime plus optional ML dependencies
        run: |
          uv sync --locked --extra retrieval --no-install-project --python "${{ matrix.python }}"
          uv export --locked --extra retrieval --no-dev --no-emit-project --output-file /tmp/ow-audit-requirements.txt > /dev/null
      - name: Assert the selected OS and audit interpreter
        env:
          EXPECTED_UBUNTU: ${{ matrix.ubuntu }}
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = "$EXPECTED_UBUNTU"
          .venv/bin/python -c 'import os,sys; assert f"{sys.version_info.major}.{sys.version_info.minor}" == os.environ["EXPECTED_PYTHON"]; print(sys.version)'
      - name: Query advisory data without resolving or fixing dependencies
        run: .venv/bin/pip-audit --requirement /tmp/ow-audit-requirements.txt --require-hashes --disable-pip --strict --timeout 30 --progress-spinner off --format json --output dependency-audit.json
      - name: Retain the public dependency report when available
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ matrix.runner }}-python${{ matrix.python }}-${{ github.sha }}
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 30
