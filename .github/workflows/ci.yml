name: Verify foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  installed-artifact:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: ow_test
          POSTGRES_USER: postgres
          # Ephemeral fixture only; never connect operational accounts or data.
          POSTGRES_PASSWORD: ci-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ow_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.23"
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python scripts/check_publication.py
      - run: uv build
      - name: Install and test the built wheel
        env:
          OW_TEST_ADMIN_DSN: postgresql://postgres:ci-fixture-only@127.0.0.1:5432/ow_test
        run: |
          uv venv /tmp/ow-installed --python 3.12
          uv pip install --python /tmp/ow-installed/bin/python dist/*.whl pytest
          /tmp/ow-installed/bin/python -c 'import osint_workbench; assert "site-packages" in osint_workbench.__file__'
          /tmp/ow-installed/bin/python -m pytest --require-integration --import-mode=importlib
      - name: Verify packaged file selection
        run: uv run python scripts/check_publication.py --artifacts dist
