name: Verify foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repository-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/check_repository.py
      - name: Scan public files and new commit metadata
        env:
          PUBLICATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python3 scripts/check_publication.py --base-revision "$PUBLICATION_BASE" --allow-base-identities
  renovate-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate schema, resolve presets and reject an unknown preset offline
        run: bash scripts/check_renovate.sh
  installed-artifact-matrix:
    name: Ubuntu ${{ matrix.ubuntu }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            ubuntu: "24.04"
            python: "3.12"
          - runner: ubuntu-24.04
            ubuntu: "24.04"
            python: "3.13"
          - runner: ubuntu-26.04
            ubuntu: "26.04"
            python: "3.14"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_DB: ow_test
          POSTGRES_USER: postgres
          # Ephemeral fixture only; never connect operational accounts or data.
          POSTGRES_PASSWORD: ci-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ow_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          prune-cache: true
      - run: uv sync --locked --extra retrieval --python "${{ matrix.python }}"
      - name: Assert the selected OS and Python runtime
        env:
          EXPECTED_UBUNTU: ${{ matrix.ubuntu }}
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = "$EXPECTED_UBUNTU"
          .venv/bin/python -c 'import os,platform,sys; assert platform.python_implementation() == "CPython"; assert f"{sys.version_info.major}.{sys.version_info.minor}" == os.environ["EXPECTED_PYTHON"]; print(sys.version)'
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - run: .venv/bin/python scripts/check_static.py
      - name: Identify native TLS prerequisites
        run: |
          openssl version
          .venv/bin/python -c 'import ssl; print("PYTHON_TLS=" + ssl.OPENSSL_VERSION)'
      - run: .venv/bin/python scripts/check_publication.py
      - name: Build and identify artifacts
        run: |
          uv build --python "${{ matrix.python }}" --build-constraints build-constraints.txt --require-hashes
          sha256sum uv.lock dist/*.whl dist/*.tar.gz
      - name: Prepare pinned native CPU test dependency
        run: |
          .venv/bin/python scripts/prepare_native.py --output /tmp/ow-native-source
          .venv/bin/cmake -S /tmp/ow-native-source/llama.cpp-f2f667b02dc76d675395ae3b14546c8108d26387 -B /tmp/ow-native-build -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DGGML_CCACHE=OFF -DCMAKE_BUILD_TYPE=Release
          .venv/bin/cmake --build /tmp/ow-native-build --target llama-server -j 2
      - name: Verify the core without optional inference dependencies
        run: |
          uv venv /tmp/ow-core --python "${{ matrix.python }}"
          uv export --locked --no-dev --no-emit-project --output-file /tmp/ow-core-requirements.txt > /dev/null
          uv pip sync --python /tmp/ow-core/bin/python --require-hashes /tmp/ow-core-requirements.txt
          uv pip install --python /tmp/ow-core/bin/python --no-deps dist/*.whl
          /tmp/ow-core/bin/python -c 'import importlib.util; assert importlib.util.find_spec("onnxruntime") is None; assert importlib.util.find_spec("tokenizers") is None'
          /tmp/ow-core/bin/osint-workbench collect --config config/sources.example.json > /tmp/ow-empty.json
          /tmp/ow-core/bin/python -c 'import json; assert json.load(open("/tmp/ow-empty.json")) == {"status": "unconfigured", "sources": 0}'
      - name: Install and test the built wheel
        env:
          OW_TEST_LLAMA_BIN: /tmp/ow-native-build/bin/llama-server
          OW_TEST_RETRIEVAL: "1"
          OW_TEST_ADMIN_DSN: postgresql://postgres:ci-fixture-only@127.0.0.1:5432/ow_test
        run: |
          uv venv /tmp/ow-installed --python "${{ matrix.python }}"
          uv export --locked --extra retrieval --no-emit-project --output-file /tmp/ow-test-requirements.txt > /dev/null
          uv pip sync --python /tmp/ow-installed/bin/python --require-hashes /tmp/ow-test-requirements.txt
          uv pip install --python /tmp/ow-installed/bin/python --no-deps dist/*.whl
          /tmp/ow-installed/bin/python -c 'import osint_workbench; assert "site-packages" in osint_workbench.__file__'
          /tmp/ow-installed/bin/python -m pytest --require-integration --import-mode=importlib
      - name: Verify packaged file selection
        run: .venv/bin/python scripts/check_publication.py --artifacts dist
      # Evidence is generated and retained only after installed tests and package scans pass.
      - name: Prepare the runtime inventory environment
        run: |
          uv venv /tmp/ow-evidence --python "${{ matrix.python }}"
          uv export --locked --extra retrieval --no-dev --no-emit-project --output-file /tmp/ow-evidence-requirements.txt > /dev/null
          uv pip sync --python /tmp/ow-evidence/bin/python --require-hashes /tmp/ow-evidence-requirements.txt
          uv pip install --python /tmp/ow-evidence/bin/python --no-deps dist/*.whl
      - name: Generate and verify build evidence
        env:
          OW_EVIDENCE_COMMIT: ${{ github.sha }}
          OW_EVIDENCE_OS: ubuntu-${{ matrix.ubuntu }}
          OW_EVIDENCE_PYTHON: ${{ matrix.python }}
          OW_EVIDENCE_RUN_ID: ${{ github.run_id }}
          OW_EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          export OW_EVIDENCE_TREE="$(git rev-parse HEAD^{tree})"
          /tmp/ow-evidence/bin/python scripts/build_evidence.py generate --artifacts dist --output /tmp/ow-pre-evidence
          .venv/bin/python scripts/check_sbom.py generate --python /tmp/ow-evidence/bin/python --manifest /tmp/ow-pre-evidence/manifest.json --output assurance/sbom.cdx.json
          /tmp/ow-evidence/bin/python scripts/check_licences.py --policy docs/security/dependency-licences.json --output assurance/licence-review.json
          /tmp/ow-evidence/bin/python scripts/build_evidence.py generate --artifacts dist --supplements assurance --output build-evidence
          /tmp/ow-evidence/bin/python scripts/build_evidence.py verify --artifacts dist --supplements assurance --output build-evidence
          .venv/bin/python scripts/check_sbom.py verify --python /tmp/ow-evidence/bin/python --manifest build-evidence/manifest.json --output assurance/sbom.cdx.json
      - name: Retain the tested distributions and public evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-evidence-${{ matrix.runner }}-python${{ matrix.python }}-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            build-evidence/*
            assurance/sbom.cdx.json
            assurance/licence-review.json
          if-no-files-found: error
          retention-days: 30
  # Keep the required check stable while requiring every matrix leg to succeed.
  installed-artifact:
    if: ${{ always() }}
    needs: installed-artifact-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every installed artifact test job
        env:
          MATRIX_RESULT: ${{ needs.installed-artifact-matrix.result }}
        run: test "$MATRIX_RESULT" = success

  attest-builds:
    # Never grant signing capabilities to PR code, manual branches or failed builds.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'rmednitzer/osint-workbench' }}
    needs: [repository-policy, renovate-policy, installed-artifact]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Same-run artifacts only. Do not check out or execute repository code here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-evidence-*
          path: evidence
          merge-multiple: false
          digest-mismatch: error
      - name: Validate the complete evidence set without executing it
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -I - <<'PYTHON'
          import hashlib, json, os, re, stat
          from pathlib import Path

          def require(condition):
              if not condition:
                  raise SystemExit('EVIDENCE_SET_REFUSED')

          def read(path, limit):
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  before = os.fstat(descriptor)
                  require(stat.S_ISREG(before.st_mode) and before.st_size <= limit)
                  data = bytearray()
                  while len(data) <= limit:
                      block = os.read(descriptor, min(1024 * 1024, limit - len(data) + 1))
                      if not block:
                          break
                      data.extend(block)
                  after = os.fstat(descriptor)
                  require(len(data) == before.st_size <= limit)
                  require((before.st_size, before.st_mtime_ns) == (after.st_size, after.st_mtime_ns))
                  return bytes(data)
              finally:
                  os.close(descriptor)

          root = Path('evidence')
          expected = {f'build-evidence-{runner}-python{version}-{os.environ["SOURCE_SHA"]}'
                      for runner, version in [('ubuntu-24.04', '3.12'), ('ubuntu-24.04', '3.13'), ('ubuntu-26.04', '3.14')]}
          require({p.name for p in root.iterdir()} == expected)
          for leg in root.iterdir():
              paths = list(leg.rglob('*'))
              require(not leg.is_symlink() and not any(p.is_symlink() for p in paths))
              files = [p for p in paths if p.is_file()]
              require(len(files) == 6)
              raw = read(leg / 'build-evidence/manifest.json', 4 * 1024 * 1024)
              require(read(leg / 'build-evidence/manifest.sha256', 65) == (hashlib.sha256(raw).hexdigest() + '\n').encode())
              receipt = json.loads(raw)
              require(receipt['format'] == 'osint-workbench-build-evidence-v2')
              require(receipt['assurance_profile'] == 'python-sbom-and-licence-review')
              require(receipt['source']['commit'] == os.environ['SOURCE_SHA'])
              require(receipt['workflow'] == {'run_id': os.environ['RUN_ID'], 'run_attempt': os.environ['RUN_ATTEMPT']})
              runtime = receipt['runtime']
              require(runtime['implementation'] == 'CPython')
              require(re.fullmatch(r'3\.(12|13|14)\.[0-9]{1,3}', runtime['python']) is not None)
              require(leg.name == f'build-evidence-{runtime["os"]}-python{".".join(runtime["python"].split(".")[:2])}-{os.environ["SOURCE_SHA"]}')
              require(len(receipt['artifacts']) == 2)
              names = [item['filename'] for item in receipt['artifacts']]
              require(sum(name.endswith('.whl') for name in names) == 1)
              require(sum(name.endswith('.tar.gz') for name in names) == 1)
              supplements = receipt['related_evidence']
              require(len(supplements) == 2 and {item['filename'] for item in supplements} == {'sbom.cdx.json', 'licence-review.json'})
              require({p.relative_to(leg).as_posix() for p in files} == {
                  'build-evidence/manifest.json', 'build-evidence/manifest.sha256',
                  'assurance/sbom.cdx.json', 'assurance/licence-review.json',
                  *(f'dist/{name}' for name in names)})
              for directory, items, limit in [('dist', receipt['artifacts'], 256 * 1024 * 1024),
                                               ('assurance', supplements, 4 * 1024 * 1024)]:
                  for item in items:
                      name = item['filename']
                      require(Path(name).name == name and re.fullmatch(r'[A-Za-z0-9._+-]+', name) is not None)
                      data = read(leg / directory / name, limit)
                      require(len(data) == item['bytes'] and hashlib.sha256(data).hexdigest() == item['sha256'])
          PYTHON
      - name: Attest the tested distributions and integrity evidence
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: false
          create-storage-record: false
          subject-path: |
            evidence/**/*.whl
            evidence/**/*.tar.gz
            evidence/**/manifest.json
            evidence/**/manifest.sha256
            evidence/**/sbom.cdx.json
            evidence/**/licence-review.json
      - name: Retain the portable signature bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-attestation-${{ github.sha }}
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
