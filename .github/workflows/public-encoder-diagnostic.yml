name: Run public profile diagnostics
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Explicit disposable diagnostic profile
        type: choice
        required: true
        default: reference-service
        options:
          - reference-service
          - public-encoder
          - both
permissions:
  contents: read
concurrency:
  group: public-diagnostic-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false
jobs:
  public-diagnostic:
    if: ${{ inputs.profile == 'public-encoder' || inputs.profile == 'both' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          prune-cache: true
      - name: Install the built wheel with locked CPU dependencies
        run: |
          uv sync --locked --extra retrieval --no-dev --python 3.12
          uv build --python .venv/bin/python --build-constraints build-constraints.txt --require-hashes
          sha256sum uv.lock dist/*.whl
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          .venv/bin/python -c 'import osint_workbench; assert "site-packages" in osint_workbench.__file__'
      - name: Verify the frozen public inputs before explicit artifact download
        run: |
          .venv/bin/python -c 'from pathlib import Path; from osint_workbench.evaluation import digest,parse_suite; assert digest(parse_suite(Path("config/evaluation.example.json").read_bytes())) == "74e962126c56ae643f8d32e2dba4009c05c661a9162997c49320302b4c43b8d0"'
          mkdir outputs
          .venv/bin/python scripts/prepare_encoder.py --output "$RUNNER_TEMP/ow-public-model" --accept-license Apache-2.0
      - name: Execute local CPU diagnostics and retain negative gates honestly
        run: |
          set +e
          .venv/bin/osint-workbench evaluate local --suite config/evaluation.example.json --output outputs/public-diagnostic --encoder-manifest "$RUNNER_TEMP/ow-public-model/encoder.json" --budget-seconds 240 --source-revision "$GITHUB_SHA"
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then exit "$result"; fi
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          root = Path("outputs/public-diagnostic")
          outcome = json.loads((root / "completed.json").read_text())
          assert outcome["status"] == "completed" and "encoder" in outcome["systems"]
          report = {"outcome": outcome, "protocol": json.loads((root / "protocol.json").read_text()), "encoder": json.loads((root / "encoder-evaluation.json").read_text()), "lexical": json.loads((root / "lexical-evaluation.json").read_text())}
          print("PUBLIC_DIAGNOSTIC_REPORT=" + json.dumps(report, sort_keys=True))
          PY
      - name: Retain only the public synthetic diagnostic, never model weights
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-encoder-diagnostic-${{ github.sha }}
          path: outputs/public-diagnostic/
          if-no-files-found: warn
          retention-days: 14
  # Selecting reference-service runs both LTS service legs without the encoder job.
  # Its synthetic HTTP namespace has no external route; this is not deployment approval.
  reference-service:
    if: ${{ inputs.profile == 'reference-service' || inputs.profile == 'both' }}
    name: Reference service / Ubuntu ${{ matrix.ubuntu }} / system Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            ubuntu: "24.04"
            python: "3.12"
          - runner: ubuntu-26.04
            ubuntu: "26.04"
            python: "3.14"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_DB: ow_test
          POSTGRES_USER: postgres
          # Public disposable-runner fixture only; never operational credentials.
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
        ports:
          - 5432:5432
        volumes:
          - /run/ow-reference-postgres:/var/run/postgresql
        options: >-
          --health-cmd "pg_isready -U postgres -d ow_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          prune-cache: true
      - name: Assert the selected OS and protected distro Python
        env:
          EXPECTED_UBUNTU: ${{ matrix.ubuntu }}
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = "$EXPECTED_UBUNTU"
          /usr/bin/python3 -c 'import os,platform,sys; assert platform.python_implementation() == "CPython"; assert f"{sys.version_info.major}.{sys.version_info.minor}" == os.environ["EXPECTED_PYTHON"]; print(sys.version)'
      - name: Prepare an installed core wheel using the protected system Python
        run: |
          uv venv /tmp/ow-reference-core --python /usr/bin/python3
          uv export --locked --no-dev --no-emit-project --output-file /tmp/ow-reference-core-requirements.txt > /dev/null
          uv pip sync --python /tmp/ow-reference-core/bin/python --require-hashes /tmp/ow-reference-core-requirements.txt
          uv build --python /usr/bin/python3 --build-constraints build-constraints.txt --require-hashes
          sha256sum uv.lock dist/*.whl
          uv pip install --python /tmp/ow-reference-core/bin/python --no-deps dist/*.whl
      - name: Accept the actual service and sandbox on this disposable runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /tmp/ow-reference-core/bin/python scripts/test_reference_deployment.py --core-venv /tmp/ow-reference-core --units config/systemd --database-fixture --enabled-http-fixture
