name: Copilot development setup
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - pyproject.toml
      - uv.lock
permissions:
  contents: read

# Coalesce initial PR attempts; isolate reruns and retain non-PR evidence.
concurrency:
  group: >-
    copilot-setup-steps-${{ github.workflow }}-${{ github.event_name }}-${{
    github.run_attempt == '1' && github.event.pull_request.number || github.run_id
    }}-${{ github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_DB: ow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ow_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          prune-cache: true
      - name: Prepare the locked development environment
        run: |
          uv sync --locked --extra retrieval --python 3.12
          uv pip check --python .venv/bin/python
      - name: Verify the offline development checks
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/python scripts/check_repository.py
          .venv/bin/python scripts/check_static.py
      - name: Expose only the disposable database fixture
        run: |
          echo 'OW_TEST_ADMIN_DSN=postgresql://postgres:ci-fixture-only@127.0.0.1:5432/ow_test' >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify the actual disposable database connection
        run: |
          .venv/bin/python - <<'PYTHON'
          import os
          import psycopg
          with psycopg.connect(os.environ['OW_TEST_ADMIN_DSN'], connect_timeout=5) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT name FROM pg_available_extensions WHERE name = 'vector'")
                  if cursor.fetchone() != ('vector',):
                      raise SystemExit('DISPOSABLE_PGVECTOR_UNAVAILABLE')
          PYTHON
