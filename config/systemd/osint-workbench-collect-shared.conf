# Optional collector service drop-in; never install implicitly for a private store.
# Provision an empty collector-owned setgid evidence root with this group first,
# The writer requires this group as its effective primary GID and creates 0750
# child directories without setting SGID under RestrictSUIDSGID=yes.
# Set OW_EVIDENCE_READ_GID explicitly in runtime.env. Existing private trees
# require a reviewed offline migration; this drop-in is not that migration.
[Service]
Group=osint-workbench-evidence
SupplementaryGroups=osint-workbench
StateDirectoryMode=2750
