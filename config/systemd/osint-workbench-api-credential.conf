# Opt-in drop-in for osint-workbench-collect-api.service; never install implicitly.
# Provision this token or OAuth client secret as root-owned 0400/0600 with no trailing newline.
# api-source.json must reference {"kind":"systemd","name":"provider-token"}.
# Directory custody and service-UID-private delivered access are checked at runtime.
[Service]
LoadCredential=provider-token:/etc/osint-workbench-secrets/provider-token
