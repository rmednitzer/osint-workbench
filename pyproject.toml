[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "osint-workbench"
version = "0.1.0.dev1"
description = "A self-hosted integration workbench for collecting, preserving and searching open-source information."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = [
  "psycopg[binary]>=3.3.6,<4",
  "pydantic>=2.14.1,<3",
  "mcp>=1.30,<2",
  "httpcore>=1.0.9,<1.1",
  "feedparser>=6.0.14,<7",
  "jsonschema>=4.26,<5",
]

[project.scripts]
osint-workbench = "osint_workbench.cli:main"

[project.optional-dependencies]
retrieval = [
    "numpy>=2,<3",
    "onnxruntime>=1.22,<2",
    "tokenizers>=0.21,<1",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.17,<1",
    "build>=1.6,<2",
    "pip-audit>=2.10,<3",
    "onnx>=1.18,<2",
    "gguf>=0.17,<1",
    "cmake>=3.31,<5",
    "mypy>=2.4,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/osint_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an isolated PostgreSQL instance"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Initial type gate: bounded wire models, sanitized errors and evidence coordinates.
# Other application modules and dynamic values are not claimed fully type-checked.
[tool.mypy]
python_version = "3.12"
files = [
    "src/osint_workbench/advisory.py",
    "src/osint_workbench/contracts.py",
    "src/osint_workbench/errors.py",
    "src/osint_workbench/text.py",
]
follow_imports = "silent"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
